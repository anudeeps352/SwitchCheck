name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Type check
        run: pyright

      - name: Test
        run: pytest

  package:
    name: Build and install package
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: python -m pip install --upgrade pip build && python -m build

      - name: Install wheel in a clean environment
        shell: bash
        run: |
          python -m venv /tmp/switchcheck-test
          /tmp/switchcheck-test/bin/python -m pip install dist/*.whl
          /tmp/switchcheck-test/bin/switchcheck --version

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: switchcheck-distributions
          path: dist/
